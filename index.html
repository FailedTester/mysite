        }

            "Абсолют+✝️ Слова Добра ✝️": "☀️ Божественный Свет",
            "☀️ Божественный Свет+❤️ Душа": "🔥 Священный Огонь",
            "🔥 Священный Огонь+💧 Вода": "💧 Святая Вода",
            "💧 Святая Вода+🌱 Земля": "🌸 Эдем",
            "🌸 Эдем+👤 Человек": "🎉 Счастье", "🎉 Счастье+✨ Добро": "💖 Милосердие",

            "🕳️ Черная Дыра+🌌 Космос": "🌀 Пространственный Разлом", "🌀 Пространственный Разлом+⚡ Энергия": "⏳ Путешествие во Времени",
            "⏳ Путешествие во Времени+Вечность": "🔄 Хроно-Парадокс", "🔄 Хроно-Парадокс+Творец": "🏛️ Зал Памяти Вселенной",
            "Галактика+Галактика": "💫 Скопление Галактик", "💫 Скопление Галактик+Мультивселенная": "🌌 Великий Предел",
            "🌌 Великий Предел+Абсолют": "👁️ Всевидящее Око", "👁️ Всевидящее Око+☀️ Божественный Свет": "✨ Первородная Искра",
            "✨ Первородная Искра+✨ Гармония": "🕊️ Небесная Тишина", "🕊️ Небесная Тишина+🌸 Эдем": "🌿 Вечный Сад",
            "🌿 Вечный Сад+🕊️ Мир": "🕊️ Горний Мир", "🕊️ Горний Мир+😇 Святость": "🌟 Небесный Престол",
            "🌟 Небесный Престол+Архангел": "🎺 Глашатай Небес", "🎺 Глашатай Небес+✝️ Слова Добра ✝️": "📖 Книга Жизни",
            "📖 Книга Жизни+Дух": "🌟 Живой Дух", "🌟 Живой Дух+Аура": "💫 Божественное Сияние",
            "💫 Божественное Сияние+Нимб": "👑 Венец Славы", "👑 Венец Славы+Бессмертие": "🕊️ Неувядаемый Цвет",
            "🕊️ Неувядаемый Цвет+🌿 Природа": "🌸 Райский Цвет", "🌸 Райский Цвет+☀️ Божественный Свет": "🔥 Неопалимая Купина",
            "🔥 Неопалимая Купина+💧 Святая Вода": "💧 Живая Вода", "💧 Живая Вода+🦠 Жизнь": "✨ Сотворение Души",
            "✨ Сотворение Души+❤️ Душа": "💖 Чистая Любовь", "💖 Чистая Любовь+✨ Добро": "🌟 Абсолютное Добро",
            "🌟 Абсолютное Добро+✝️ Слова Добра ✝️": "⚡ Вечный Свет Добра"
        };

        const achievementsList = [
            { id: 1, title: "Искра творения", desc: "Соедините первые два элемента и получите новый." },
            { id: 2, title: "Исследователь стихий", desc: "Откройте 30 уникальных элементов в игре." },
            { id: 3, title: "Истинный Маг", desc: "Откройте 50 элементов (пройдите режим «Человек»)." },
            { id: 4, title: "Чистый разум", desc: "Добберитесь до финала любого режима, не используя подсказки ни разу." },
            { id: 5, title: "Путь света", desc: "Откройте элемент «✨ Добро»." },
            { id: 6, title: "Коллекционер", desc: "Откройте 5 элементов путем слияния одинаковых стихий (например, Дождь + Дождь)." },
            { id: 7, title: "Гармония мира", desc: "Откройте элемент «🕊️ Мир» или «✨ Гармония»." },
            { id: 8, title: "Упорство", desc: "Потратьте в сумме >1000 очков на штрафы за ошибки, преодолев рубеж в 75 элементов." },
            { id: 9, title: "Вселенский масштаб", desc: "Откройте «Мультивселенную» или «🌌 Космос»." },
            { id: 10, title: "Слово Добра", desc: "Достигните финала и откройте главный элемент «✝️ Слова Добра ✝️»." }
        ];

        const limits = { human: 55, mage: 110, god: 200 };
        
        let currentDiff = 'human', openedElements = [], score = 0, hintsUsed = 0, slot1 = null, slot2 = null;
        let achievements = JSON.parse(localStorage.getItem('alchemy_achievements')) || [];
        let errorPenaltySum = 0;
        let selfCombineCount = 0;

        const getActiveRecipes = () => {
            return fullRecipes;
        };

        function unlockAchievement(id) {
            if (!achievements.includes(id)) {
                achievements.push(id);
                localStorage.setItem('alchemy_achievements', JSON.stringify(achievements));
                const ach = achievementsList.find(a => a.id === id);
                
                const msg = document.getElementById('gameMsg');
                const currentText = msg.innerHTML.includes('Новый элемент') ? msg.innerHTML : '✨ Успешное соединение!';
                msg.innerHTML = `${currentText}<br><span style="color: #ffd700; font-weight: bold;">🏆 Достижение: ${ach.title}</span>`;
            }
        }

        function toggleAchModal(show) {
            const modal = document.getElementById('achModal');
            modal.style.display = show ? 'flex' : 'none';
            if (show) renderAchievementsList();
        }

        function renderAchievementsList() {
            const container = document.getElementById('achListContainer');
            document.getElementById('achCount').textContent = achievements.length;
            container.innerHTML = '';
            achievementsList.forEach(a => {
                const unlocked = achievements.includes(a.id);
                const div = document.createElement('div');
                div.className = 'ach-item' + (unlocked ? ' unlocked' : '');
                div.innerHTML = `<div class="ach-title">${unlocked ? '✔ ' : '🔒 '}${a.title}</div><div class="ach-desc">${a.desc}</div>`;
                container.appendChild(div);
            });
        }

        function checkAchievements() {
            if (openedElements.length > 4) unlockAchievement(1);
            if (openedElements.length >= 30) unlockAchievement(2);
            if (openedElements.length >= 50) unlockAchievement(3);
            if (hintsUsed === 0 && openedElements.length >= limits[currentDiff]) unlockAchievement(4);
            if (openedElements.includes("✨ Добро")) unlockAchievement(5);
            if (selfCombineCount >= 5) unlockAchievement(6);
            if (openedElements.includes("🕊️ Мир") || openedElements.includes("✨ Гармония")) unlockAchievement(7);
            if (errorPenaltySum >= 1000 && openedElements.length >= 75) unlockAchievement(8);
            if (openedElements.includes("Мультивселенная") || openedElements.includes("🌌 Космос")) unlockAchievement(9);
            if (openedElements.includes("✝️ Слова Добра ✝️")) unlockAchievement(10);
        }

        function loadState() {
            openedElements = JSON.parse(localStorage.getItem(`alchemy_opened_${currentDiff}`)) || [...initialElements];
            score = parseInt(localStorage.getItem(`alchemy_score_${currentDiff}`)) || 0;
            hintsUsed = parseInt(localStorage.getItem(`alchemy_hints_${currentDiff}`)) || 0;
            errorPenaltySum = parseInt(localStorage.getItem(`alchemy_errors_${currentDiff}`)) || 0;
            selfCombineCount = parseInt(localStorage.getItem(`alchemy_self_${currentDiff}`)) || 0;
            updateUI();
        }

        function saveState() {
            localStorage.setItem(`alchemy_opened_${currentDiff}`, JSON.stringify(openedElements));
            localStorage.setItem(`alchemy_score_${currentDiff}`, score);
            localStorage.setItem(`alchemy_hints_${currentDiff}`, hintsUsed);
            localStorage.setItem(`alchemy_errors_${currentDiff}`, errorPenaltySum);
            localStorage.setItem(`alchemy_self_${currentDiff}`, selfCombineCount);

            let fixedBest = parseInt(localStorage.getItem(`alchemy_best_fixed_${currentDiff}`)) || 0;
            if (hintsUsed === 0) {
                if (score > fixedBest) {
                    localStorage.setItem(`alchemy_best_fixed_${currentDiff}`, score);
                }
            }

            updateUI();
            checkAchievements();
        }

        function setDifficulty(diff) {
            currentDiff = diff;
            slot1 = slot2 = null;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.toggle('active', b.dataset.diff === diff));
            document.getElementById('gameMsg').textContent = "Выберите два элемента для соединения";
            loadState();
        }

        function updateUI() {
            document.getElementById('progress').textContent = `${openedElements.length} / ${limits[currentDiff]}`;
            document.getElementById('currentScore').textContent = score;
            document.getElementById('hintsUsed').textContent = hintsUsed;

            const highScoreEl = document.getElementById('highScore');
            let fixedBest = parseInt(localStorage.getItem(`alchemy_best_fixed_${currentDiff}`)) || 0;
            let currentLiveHigh = parseInt(localStorage.getItem(`alchemy_high_${currentDiff}`)) || 0;

            if (hintsUsed === 0 && score > currentLiveHigh) {
                currentLiveHigh = score;
                localStorage.setItem(`alchemy_high_${currentDiff}`, currentLiveHigh);
            }

            let displayRecord = hintsUsed > 0 ? fixedBest : currentLiveHigh;

            highScoreEl.style.fontSize = "12px";
            highScoreEl.style.color = "#ffd700";
            highScoreEl.textContent = displayRecord;

            const s1 = document.getElementById('slot1'), s2 = document.getElementById('slot2');
            s1.textContent = slot1 || "Слот 1"; s1.className = slot1 ? "slot active" : "slot";
            s2.textContent = slot2 || "Слот 2"; s2.className = slot2 ? "slot active" : "slot";

            const grid = document.getElementById('elementsGrid');
            grid.innerHTML = '';
            openedElements.forEach(el => {
                const btn = document.createElement('div');
                btn.className = 'element-btn' + (el === slot1 || el === slot2 ? ' selected' : '');
                btn.textContent = el;
                btn.onclick = () => selectElement(el);
                grid.appendChild(btn);
            });
        }

        function selectElement(el) {
            if (!slot1) slot1 = el;
            else if (!slot2) { slot2 = el; tryCombine(); }
            else { slot1 = el; slot2 = null; }
            updateUI();
        }

        const clearSlot = num => { if (num === 1) slot1 = null; if (num === 2) slot2 = null; updateUI(); };

        function tryCombine() {
            const msg = document.getElementById('gameMsg');
            const result = getActiveRecipes()[`${slot1}+${slot2}`] || getActiveRecipes()[`${slot2}+${slot1}`];

            if (result) {
                if (slot1 === slot2) {
                    selfCombineCount++;
                }

                if (!openedElements.includes(result)) {
                    openedElements.push(result);
                    score += 100;
                    msg.style.color = '#ffd700';
                    msg.textContent = `✨ Новый элемент: ${result}! (+100 очков)`;
                } else {
                    msg.style.color = '#aaa';
                    msg.textContent = `Элемент "${result}" уже открыт.`;
                }
            } else {
                score = Math.max(0, score - 5);
                errorPenaltySum += 5;
                msg.style.color = '#b22222';
                msg.textContent = '❌ Элементы не соединяются (-5 очков)';
            }
            saveState();
            slot1 = slot2 = null;
            updateUI();
        }

        function getHint() {
            const msg = document.getElementById('gameMsg');
            let possibleHints = [];

            for (const [recipeKey, res] of Object.entries(fullRecipes)) {
                const [el1, el2] = recipeKey.split('+');

                if (openedElements.includes(el1) && openedElements.includes(el2) && !openedElements.includes(res)) {
                    const currentLimit = limits[currentDiff];
                    if (openedElements.length < currentLimit) {
                        possibleHints.push({ el1, el2, res });
                    }
                }
            }

            if (possibleHints.length > 0) {
                const found = possibleHints[Math.floor(Math.random() * possibleHints.length)];
                
                if (hintsUsed === 0) {
                    let currentBest = parseInt(localStorage.getItem(`alchemy_best_fixed_${currentDiff}`)) || 0;
                    if (score > currentBest) {
                        localStorage.setItem(`alchemy_best_fixed_${currentDiff}`, score);
                    }
                }

                score = score >= 200 ? score - 200 : 0;
                hintsUsed++;
                saveState();
                slot1 = found.el1; slot2 = found.el2;
                msg.style.color = '#ffd700';
                msg.textContent = `💡 Подсказка: соедините ${found.el1} и ${found.el2}!`;
                updateUI();
            } else {
                msg.style.color = '#888';
                msg.textContent = '🔍 Все доступные комбинации уже найдены!';
            }
        }

        function resetAlchemy() {
            if (confirm(`Сбросить прогресс для уровня "${currentDiff.toUpperCase()}"?`)) {
                openedElements = [...initialElements];
                score = hintsUsed = errorPenaltySum = selfCombineCount = 0;
                slot1 = slot2 = null;
                localStorage.removeItem(`alchemy_best_fixed_${currentDiff}`);
                localStorage.removeItem(`alchemy_high_${currentDiff}`);
                saveState();
                document.getElementById('gameMsg').textContent = "Прогресс сброшен.";
                updateUI();
            }
        }

        loadState();
    </script>
